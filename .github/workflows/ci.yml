name: CI

on:
  push:
  pull_request:

env:
  NODE_VERSION: 22

jobs:
  quality:
    name: Quality and unit tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_quality
      SESSION_SECRET: ci-only-session-secret-with-more-than-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma validate --schema packages/db/prisma/schema.prisma
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

  integration:
    name: PostgreSQL migrations, seed and integration
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finance_integration
          POSTGRES_USER: ci_test_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test_user -d finance_integration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci_test_user:ci_test_password@localhost:5432/finance_integration
      TEST_DATABASE_URL: postgresql://ci_test_user:ci_test_password@localhost:5432/finance_integration
      SESSION_SECRET: ci-only-session-secret-with-more-than-32-characters
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma validate --schema packages/db/prisma/schema.prisma
      - run: npm run db:migrate
      - run: DEMO_PASSWORD='ci-only-demo-password' npm run db:seed
      - run: npm run test:integration --workspace=@finance/api

  e2e:
    name: PostgreSQL authenticated E2E
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finance_e2e
          POSTGRES_USER: ci_e2e_user
          POSTGRES_PASSWORD: ci_e2e_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_e2e_user -d finance_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci_e2e_user:ci_e2e_password@localhost:5432/finance_e2e
      E2E_DATABASE_URL: postgresql://ci_e2e_user:ci_e2e_password@localhost:5432/finance_e2e
      SESSION_SECRET: ci-only-session-secret-with-more-than-32-characters
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma validate --schema packages/db/prisma/schema.prisma
      - run: npm run db:migrate
      - run: DEMO_PASSWORD='ci-only-demo-password' npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 5
